<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SinStreams</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Mobile optimization rules — preserve all touch usability & responsive layouts */
  @media (max-width: 768px) {
    /* Navbar */
    .sinema-nav {
      padding: 0 16px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
    }
    
    /* Hero slider - responsive height on mobile */
    .hero-slider-container {
      height: 65vh !important;
      min-height: 420px !important;
    }
    
    /* Hero content - proper padding & spacing */
    .hero-slider-container .hs-content {
      padding: 0 20px !important;
      padding-top: 70px !important;
    }
    
    /* Hero title - scalable on mobile */
    .hero-slider-container h1 {
      font-size: 28px !important;
      margin-bottom: 12px !important;
      line-height: 1.15 !important;
    }
    
    /* Hero buttons - stack nicely on mobile */
    .hero-slider-container .hs-buttons {
      flex-wrap: wrap !important;
      gap: 10px !important;
    }
    
    /* Hero buttons - touch friendly sizing */
    .hero-slider-container .hs-btn {
      padding: 10px 20px !important;
      font-size: 13px !important;
    }
    
    /* Hero synopsis - hide or clamp on smaller screens */
    .hero-slider-container p {
      display: -webkit-box !important;
      -webkit-line-clamp: 2 !important;
      -webkit-box-orient: vertical !important;
      overflow: hidden !important;
    }
    
    /* Hero thumbnails - hide on mobile */
    .hero-slider-container .hs-thumbnails {
      display: none !important;
    }
  }
  
  @media (max-width: 480px) {
    .hero-slider-container {
      height: 58vh !important;
      min-height: 340px !important;
    }
    
    .hero-slider-container h1 {
      font-size: 22px !important;
    }
    
    .hero-slider-container .hs-btn {
      padding: 8px 16px !important;
      font-size: 12px !important;
    }
    
    /* Grid */
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
      gap: 12px !important;
    }
    
    /* Watch page */
    .watch-details {
      flex-direction: column !important;
      align-items: center !important;
    }
    
    .watch-poster {
      width: 150px !important;
    }
    
    .watch-video {
      border-radius: 0 !important;
    }
    
    /* Details page - center cleanly on mobile */
    .details-main {
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
    }
    
    .details-poster {
      width: 180px !important;
      margin: 0 auto 20px !important;
    }
    
    .details-poster img {
      width: 100% !important;
    }
    
    /* Center meta row */
    .details-main .metaRow {
      justify-content: center !important;
    }
    
    /* Center genre pills */
    .details-main .genreRow {
      justify-content: center !important;
    }
    
    /* Center action buttons */
    .details-main .actionRow {
      justify-content: center !important;
      flex-wrap: wrap !important;
    }
    
    /* Smaller title */
    .details-main h1 {
      font-size: 24px !important;
      text-align: center !important;
    }
    
    /* Synopsis left-align for readability */
    .details-main p {
      text-align: left !important;
    }
    
    /* Video modal */
    .video-player-overlay {
      padding: 0 !important;
    }
    
    .video-player-container {
      border-radius: 0 !important;
    }
    
    /* Padding */
    .page-content {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }
    
    /* Title sizes */
    .page-title {
      font-size: 18px !important;
    }
  }
  
  @media (max-width: 480px) {
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important;
      gap: 10px !important;
    }
    /* Watch page episode controls */
    .watch-details {
      padding: 16px !important;
    }
    
    /* Episode bar - stack vertically */
    .episode-bar {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 12px !important;
    }
    
    /* Episode controls - full width */
    .episode-controls {
      width: 100% !important;
      flex-wrap: wrap !important;
      gap: 8px !important;
    }
    
    /* Select dropdowns */
    .episode-controls select {
      width: 100% !important;
      min-width: auto !important;
      padding: 8px 10px !important;
      font-size: 12px !important;
      background: rgba(18, 18, 22, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #fff !important;
    }
    
    /* Select group - take equal space */
    .select-group {
      flex: 1 !important;
      min-width: 100px !important;
    }
    
    /* Source buttons - wrap nicely */
    .source-buttons {
      gap: 6px !important;
    }
    
    .source-buttons button {
      padding: 6px 10px !important;
      font-size: 11px !important;
    }
    
    /* Video controls section */
    .controls-section {
      padding: 12px 16px !important;
      overflow-x: auto !important;
    }
  }
  
  @media (max-width: 480px) {
    .episode-controls select {
      font-size: 11px !important;
      padding: 6px 8px !important;
    }
    
    .source-buttons button {
      padding: 5px 8px !important;
      font-size: 10px !important;
    }
    /* Search overlay - centered frosted card */
    .sin-search-overlay {
      left: 10px !important;
      right: 10px !important;
      transform: translateX(0) !important;
      top: 76px !important;
      width: auto !important;
      max-width: calc(100vw - 20px) !important;
      border-radius: 14px !important;
    }
    
    /* Search input */
    .sin-search-input {
      font-size: 14px !important;
    }
    
    /* Search results */
    .sin-search-overlay .sin-result-item {
      padding: 10px 12px !important;
    }
    
    /* Mini poster */
    .sin-search-overlay .sin-result-item > div:first-child {
      width: 34px !important;
      height: 48px !important;
    }
    
    /* Result title */
    .sin-search-overlay .sin-result-item .sin-result-title {
      font-size: 13px !important;
    }
  }
</style>
    <script>
  // Block common ad/popup scripts
  window.addEventListener('load', function() {
    setInterval(function() {
      if (window.opener || document.hidden === false) {
      }
    }, 1000);
  });

  window.addEventListener('beforeunload', function(e) {
    e.stopImmediatePropagation();
  }, true);
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/Adguard prompt.js" defer></script>
  </body>
</html>
