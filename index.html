<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* These ONLY apply on mobile - won't affect desktop at all */
  @media (max-width: 768px) {
    /* Navbar */
    .sinema-nav {
      padding: 0 16px !important;
    }
    
    /* Hero slider - smaller height on mobile */
    .hero-slider-container {
      height: 60vh !important;
      min-height: 400px !important;
    }
    
    /* Hero content - less padding, smaller text */
    .hero-slider-container .hs-content {
      padding: 0 20px !important;
    }
    
    /* Hero title - smaller on mobile */
    .hero-slider-container h1 {
      font-size: 28px !important;
      margin-bottom: 10px !important;
    }
    
    /* Hero buttons - stack on mobile */
    .hero-slider-container .hs-buttons {
      flex-wrap: wrap !important;
      gap: 8px !important;
    }
    
    /* Hero buttons - smaller */
    .hero-slider-container .hs-btn {
      padding: 10px 20px !important;
      font-size: 13px !important;
    }
    
    /* Hero synopsis - hide on very small screens */
    .hero-slider-container p {
      display: none !important;
    }
    
    /* Hero thumbnails - hide on mobile */
    .hero-slider-container .hs-thumbnails {
      display: none !important;
    }
  }
  
  @media (max-width: 480px) {
    .hero-slider-container {
      height: 50vh !important;
      min-height: 300px !important;
    }
    
    .hero-slider-container h1 {
      font-size: 22px !important;
    }
    
    .hero-slider-container .hs-btn {
      padding: 8px 16px !important;
      font-size: 12px !important;}
    
    /* Grid */
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
      gap: 12px !important;
    }
    
    /* Watch page */
    .watch-details {
      flex-direction: column !important;
      align-items: center !important;
    }
    
    .watch-poster {
      width: 150px !important;
    }
    
    .watch-video {
      border-radius: 0 !important;
    }
    
    /* Details page */
     /* Details page - center everything */
    .details-main {
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
    }
    
    .details-poster {
      width: 180px !important;
      margin: 0 auto 20px !important;
    }
    
    .details-poster img {
      width: 100% !important;
    }
    
    /* Center meta row */
    .details-main .metaRow {
      justify-content: center !important;
    }
    
    /* Center genre pills */
    .details-main .genreRow {
      justify-content: center !important;
    }
    
    /* Center action buttons */
    .details-main .actionRow {
      justify-content: center !important;
      flex-wrap: wrap !important;
    }
    
    /* Smaller title */
    .details-main h1 {
      font-size: 24px !important;
      text-align: center !important;
    }
    
    /* Synopsis left-align for readability */
    .details-main p {
      text-align: left !important;
    }
    
    /* Video modal */
    .video-player-overlay {
      padding: 0 !important;
    }
    
    .video-player-container {
      border-radius: 0 !important;
    }
    
    /* Padding */
    .page-content {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }
    
    /* Title sizes */
    .page-title {
      font-size: 18px !important;
    }
  }
  
  @media (max-width: 480px) {
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
      gap: 10px !important;
    }
    /* Watch page episode controls */
    .watch-details {
      padding: 16px !important;
    }
    
    /* Episode bar - stack vertically */
    .episode-bar {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 12px !important;
    }
    
    /* Episode controls - full width */
    .episode-controls {
      width: 100% !important;
      flex-wrap: wrap !important;
      gap: 8px !important;
    }
    
    /* Select dropdowns - smaller */
    .episode-controls select {
      width: 100% !important;
      min-width: auto !important;
      padding: 8px 10px !important;
      font-size: 12px !important;
    }
    
    /* Select group - take equal space */
    .select-group {
      flex: 1 !important;
      min-width: 100px !important;
    }
    
    /* Source buttons - wrap nicely */
    .source-buttons {
      gap: 6px !important;
    }
    
    .source-buttons button {
      padding: 6px 10px !important;
      font-size: 10px !important;
    }
    
    /* Video controls section */
    .controls-section {
      padding: 12px 16px !important;
      overflow-x: auto !important;
    }
  }
  
  @media (max-width: 480px) {
    .episode-controls select {
      font-size: 11px !important;
      padding: 6px 8px !important;
    }
    
    .source-buttons button {
      padding: 5px 8px !important;
      font-size: 9px !important;
    }
    /* Search overlay - center it */
    .sin-search-overlay {
      left: 10px !important;
      right: 10px !important;
      transform: translateX(0) !important;
      top: 80px !important;
      width: auto !important;
      max-width: calc(100vw - 20px) !important;
    }
    
    /* Search input */
    .sin-search-input {
      font-size: 13px !important;
    }
    
    /* Search results */
    .sin-search-overlay .sin-result-item {
      padding: 8px 12px !important;
    }
    
    /* Mini poster smaller */
    .sin-search-overlay .sin-result-item > div:first-child {
      width: 30px !important;
      height: 42px !important;
    }
    
    /* Result title smaller */
    .sin-search-overlay .sin-result-item .sin-result-title {
      font-size: 12px !important;
    }
  }
  
  @media (max-width: 480px) {
    .sin-search-overlay {
      top: 70px !important;
      left: 5px !important;
      right: 5px !important;
      max-width: calc(100vw - 10px) !important;
      border-radius: 10px !important;
    }
  }
</style>
    <title>sinstreams</title>

  // Block common ad/popup scripts
  window.addEventListener('load', function() {
    // Block popunders
    setInterval(function() {
      if (window.opener || document.hidden === false) {
        // Keep focus on current window
      }
    }, 1000);
  });

  // Prevent beforeunload popups
  window.addEventListener('beforeunload', function(e) {
    e.stopImmediatePropagation();
  }, true);
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
